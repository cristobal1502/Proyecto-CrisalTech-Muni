<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGR Municipal — Revisa tu correo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="mark">SGR</span>
      <span class="brand-name">SGR Municipal</span>
    </div>

    <div class="status-icon success">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
    </div>

    <div class="login-heading">
      <h1>Revisa tu correo</h1>
      <p>Si el correo que ingresaste está registrado en nuestro sistema, te enviamos un enlace para restablecer tu contraseña. El enlace es de un solo uso y expira por seguridad.</p>
    </div>

    <div class="login-footer">
      <a href="{% url 'login' %}" class="forgot-link">Volver a iniciar sesión</a>
    </div>
  </div>
</div>

</body>
</html>
